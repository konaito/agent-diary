<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm";
import { SUPABASE_KEY, SUPABASE_URL } from "./config.js";
import { DEMO_ENTRIES, DEMO_ENTRIES_EN } from "./demo.js";
import * as ui from "./ui.js";

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  // 保存名は改名前のまま。変えると、今ログインしているブラウザが持ち主として読めなくなる
  auth: { storageKey: "cc-diary-auth", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
});
const $ = (id) => document.getElementById(id);
const root = $("root");
// ---------- 言語 ----------
// 日記の持ち主の画面は日本語。デモだけ英語と日本語を切り替えられる
const I18N = {
  ja: {
    weekdays: ["日", "月", "火", "水", "木", "金", "土"],
    search: "検索",
    all: "すべて",
    empty: "該当する日記はない。",
    none: "日記はまだない。Claude Codeのセッションを閉じると、ここに増える。",
    dayMeta: (y, wd, n) => `${y} ${wd}曜 · ${n}件`,
    option: (p, n) => `${p}（${n}）`,
    meta: (p, t) => `依頼 ${p} · ツール ${t}`,
    did: "やったこと",
    failed: "うまくいかなかったこと",
    learned: "分かったこと",
    open: "残っていること",
    files: "書き込んだファイル",
    demo: "デモ",
    basis: "架空の日記",
    visitors: (n) => `訪れた人 ${n}`,
    switchTo: { lang: "en", label: "English" },
    grass: "日ごとの日記の数",
    total: (n, days) => `<span class="character-4-bold-mono">${n}</span> 件 · ${days}日`,
    month: (m) => `${m}月`,
    grassWeekdays: ["月", "水", "金"],
    cell: (md, wd, n) => `${md}（${wd}）${n}件`,
    grassLess: "少ない",
    grassMore: "多い",
  },
  en: {
    weekdays: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
    search: "Search",
    all: "All",
    empty: "No matching entries.",
    none: "No entries yet.",
    dayMeta: (y, wd, n) => `${y} ${wd} · ${n} ${n === 1 ? "entry" : "entries"}`,
    option: (p, n) => `${p} (${n})`,
    meta: (p, t) => `${p} requests · ${t} tool calls`,
    did: "Done",
    failed: "Didn't work",
    learned: "Learned",
    open: "Still open",
    files: "Files written",
    demo: "Demo",
    basis: "fictional entries",
    visitors: (n) => `${n} ${n === 1 ? "visitor" : "visitors"}`,
    switchTo: { lang: "ja", label: "日本語" },
    grass: "Entries per day",
    total: (n, days) => `<span class="character-4-bold-mono">${n}</span> ${n === 1 ? "entry" : "entries"} · ${days} ${days === 1 ? "day" : "days"}`,
    month: (m) => ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][m - 1],
    grassWeekdays: ["Mon", "Wed", "Fri"],
    cell: (md, wd, n) => `${wd} ${md} · ${n} ${n === 1 ? "entry" : "entries"}`,
    grassLess: "Less",
    grassMore: "More",
  },
};
let LANG = "ja";
const L = () => I18N[LANG];

// デモの言語。?lang= の指定、前回選んだ言語、ブラウザの言語の順で決める
function demoLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "en" || q === "ja") {
    try { localStorage.setItem("agent-diary-lang", q); } catch {}
    return q;
  }
  try {
    const saved = localStorage.getItem("agent-diary-lang");
    if (saved === "en" || saved === "ja") return saved;
  } catch {}
  return (navigator.languages?.[0] ?? navigator.language ?? "ja").toLowerCase().startsWith("ja") ? "ja" : "en";
}
const PAGE_URL = location.origin + location.pathname;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const hm = (iso) => new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso));
// 日付文字列の曜日。暦日として UTC で計算するのでブラウザのタイムゾーンに左右されない
const wday = (d) => L().weekdays[new Date(`${d}T00:00:00Z`).getUTCDay()];
const tokyoDay = (iso) => new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Tokyo" }).format(new Date(iso));

// Supabase のエラーを短い日本語にする
function authMessage(e) {
  const code = e?.code ?? "";
  const m = e?.message ?? String(e);
  if (code === "otp_disabled" || /signups not allowed/i.test(m)) return "このアドレスは持ち主として登録されていない。";
  if (code === "email_address_not_authorized") return "このアドレスには送れない。Supabase の標準のメール送信は、組織のメンバーのアドレスにだけ送れる。";
  if (code === "over_email_send_rate_limit" || /rate limit/i.test(m)) return "メールの送信回数の上限に達した（1時間に2通）。しばらく待ってからやり直す。";
  if (code === "otp_expired" || /expired|invalid/i.test(m)) return "コードが違うか、期限が切れている。";
  if (code === "email_exists" || /already been registered/i.test(m)) return "このアドレスは別のユーザーで登録済み。";
  return m;
}

// 画面いっぱいのお知らせ。icon は Material Symbols の名前、bad なら赤くする
function notice(big, text, extraHtml = "", { icon = "info", bad = false } = {}) {
  root.innerHTML = `
    <div class="mx-auto max-w-md px-4 pt-[12vh] pb-16 text-center">
      <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full ${bad ? "bg-negative-50 text-negative-500" : "bg-primary-50 text-primary-500"}">${ui.icon(icon, 8)}</div>
      <h1 class="character-7-bold-pro text-text-high">${esc(big)}</h1>
      <p class="mt-2 character-3-regular-pro text-text-middle">${esc(text)}</p>
      ${extraHtml}
    </div>`;
}

// ---------- 認証 ----------

// 訪問者は全員匿名ログインする。訪れた人数は匿名ユーザーの数で数える
async function currentUser() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) return session.user;
  const { data, error } = await sb.auth.signInAnonymously();
  if (error) throw error;
  return data.user;
}

// 持ち主かどうかを返す。持ち主が決まっていなければ、このユーザーが持ち主になる
async function claimOwner() {
  const { data, error } = await sb.rpc("claim_site");
  if (error) throw error;
  return data === true;
}

// 訪問を記録して、訪れた人数を返す。数えられなくても画面は出す
async function recordVisit(view) {
  const { data, error } = await sb.rpc("record_visit", { p_view: view });
  return error ? null : data;
}
const visitorsText = (stats) => (stats ? `訪れた人 ${stats.visitors}` : "");

// ラベルつきの入力欄。Sparkle の Input と同じ枠
const field = (id, labelText, attrs, { size = "md", cls = "" } = {}) => `
  <label class="${ui.label}" for="${id}">${esc(labelText)}</label>
  <div class="${ui.input.wrap} ${ui.input[size]}"><input class="${ui.input.field} ${cls}" id="${id}" ${attrs}></div>`;

// メールアドレスにコードを送り、入力されたコードで確認するフォーム。
// send(email) はコードを送る処理、verify(email, token) は確認する処理
function codeForm(container, { intro, sendLabel, send, verify, done }) {
  container.innerHTML = `
    <form class="grid gap-2 text-left" data-step="email">
      ${intro ? `<p class="character-2-regular-pro text-text-middle">${esc(intro)}</p>` : ""}
      ${field("em", "メールアドレス", `type="email" inputmode="email" autocomplete="email" required`)}
      <button class="${ui.button()} mt-2 w-full" type="submit">${esc(sendLabel)}</button>
      <div class="${ui.fieldMessage}" data-msg aria-live="polite"></div>
    </form>`;
  const form = container.querySelector("form");
  const msg = form.querySelector("[data-msg]");
  let email = "";
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = form.querySelector("button");
    btn.disabled = true;
    msg.className = ui.fieldMessage;
    try {
      if (form.dataset.step === "email") {
        email = form.querySelector("#em").value.trim();
        msg.textContent = "送っている";
        if ((await send(email)) === "done") {
          await done();
          return;
        }
        form.dataset.step = "code";
        form.innerHTML = `
          <p class="character-2-regular-pro text-text-middle">${esc(email)} にコードを送った。メールに書いてある数字を入れる。</p>
          ${field("code", "コード", `inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="10" required`, { size: "lg", cls: "text-center tracking-[.3em]" })}
          <button class="${ui.button()} mt-2 w-full" type="submit">確認する</button>
          <div class="${ui.fieldMessage}" data-msg aria-live="polite"></div>`;
        form.querySelector("#code").focus();
      } else {
        const token = form.querySelector("#code").value.replace(/\s/g, "");
        await verify(email, token);
        await done();
      }
    } catch (e) {
      const m = form.querySelector("[data-msg]");
      m.className = ui.fieldError;
      m.innerHTML = `${ui.icon("error", 3)}${esc(authMessage(e))}`;
    } finally {
      const b = form.querySelector("button");
      if (b) b.disabled = false;
    }
  });
}

// ---------- アカウントのシート ----------

$("sheetBg").className = ui.dialog.overlay;
$("sheet").className = ui.dialog.panel;

function openSheet(title, text, bodyHtml, setup) {
  $("sheet").setAttribute("aria-label", title);
  $("sheet").innerHTML = `
    <button class="${ui.iconButton} absolute right-3 top-3" type="button" data-close aria-label="閉じる">${ui.icon("close", 5)}</button>
    <h2 class="${ui.dialog.title}">${esc(title)}</h2>
    <p class="${ui.dialog.text}">${text}</p>
    <div class="mt-5">${bodyHtml}</div>`;
  $("sheet").hidden = false;
  $("sheetBg").hidden = false;
  $("sheet").querySelector("[data-close]").onclick = closeSheet;
  setup?.($("sheet"));
}
function closeSheet() {
  $("sheet").hidden = true;
  $("sheetBg").hidden = true;
}
$("sheetBg").onclick = closeSheet;
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && !$("sheet").hidden) closeSheet();
});

function setupAccount(user) {
  const btn = $("acctBtn");
  // スマホのヘッダーは検索欄に幅を譲るので、アイコンだけにする
  btn.className = `${ui.button({ variant: "ghost", theme: "neutral", size: "sm" })} max-sm:min-w-0 max-sm:px-2`;
  btn.hidden = false;
  if (user.is_anonymous) {
    btn.setAttribute("aria-label", "メール未登録");
    btn.innerHTML = `<span class="relative inline-flex sm:hidden">${ui.icon("account_circle", 5)}<span class="${ui.dot} absolute -right-0.5 -top-0.5"></span></span><span class="hidden sm:inline-flex items-center"><span class="${ui.dot} mr-1.5"></span>メール未登録</span>`;
    btn.onclick = () => openRegister();
  } else {
    btn.setAttribute("aria-label", "アカウント");
    btn.innerHTML = `${ui.icon("account_circle", 5, { cls: "sm:hidden" })}<span class="hidden sm:inline-flex items-center">${ui.buttonIcon("account_circle", "sm")}アカウント</span>`;
    btn.onclick = () =>
      openSheet(
        "アカウント",
        `${esc(user.email)} でログインしている。他の端末では、このアドレスに届くコードでログインできる。`,
        `<button class="${ui.button({ variant: "outline", theme: "neutral" })} w-full" id="logout" type="button">${ui.buttonIcon("logout")}この端末からログアウト</button>`,
        (el) => {
          el.querySelector("#logout").onclick = async () => {
            await sb.auth.signOut();
            location.reload();
          };
        },
      );
  }
}

// 匿名の持ち主にメールアドレスを結び付ける。ユーザー ID は変わらないので、持ち主のまま他の端末からもログインできる
function openRegister() {
  openSheet("他の端末でも読む", "今はこの端末のブラウザでだけ読める。メールアドレスを登録すると、スマホや別の PC でもコードでログインできる。", `<div id="regForm"></div>`, (el) => {
    codeForm(el.querySelector("#regForm"), {
      sendLabel: "コードを送る",
      send: async (email) => {
        const { data, error } = await sb.auth.updateUser({ email }, { emailRedirectTo: PAGE_URL });
        if (error) throw error;
        // メール確認がオフの環境では、この時点で登録が終わっている
        if (data.user?.email === email && !data.user.is_anonymous) return "done";
      },
      verify: async (email, token) => {
        const { error } = await sb.auth.verifyOtp({ email, token, type: "email_change" });
        if (error) throw error;
      },
      done: async () => {
        el.querySelector("#regForm").innerHTML = `<p class="character-2-regular-pro text-text-middle">登録した。他の端末では、ページの「持ち主ならメールでログイン」から入れる。</p>`;
        const { data: { user } } = await sb.auth.getUser();
        if (user) setupAccount(user);
        document.querySelector("[data-callout]")?.remove();
      },
    });
  });
}

// ---------- 日記の表示 ----------

let entries = [];

// 開いた日記の中の見出しのアイコンと色
const SECTION = {
  did: ["check_circle", "text-success-500"],
  failed: ["error", "text-negative-500"],
  learned: ["lightbulb", "text-warning-500"],
  open: ["pending", "text-info-500"],
  pr: ["merge", "text-primary-500"],
  files: ["description", "text-neutral-500"],
};

// ---------- 草 ----------

// 草の見出しの右に出す件数以外の情報と、草の右端の日と、枠を付ける今日。start() で決める
let grassMeta = "";
let grassUntil = "";
let grassToday = "";

// 1マスが1日。色はその日に書いた日記の件数で4段に分ける
const GRASS_LEVELS = [[13, "bg-success-800"], [7, "bg-success-600"], [3, "bg-success-400"], [1, "bg-success-200"]];
const grassColor = (n) => GRASS_LEVELS.find(([min]) => n >= min)?.[1] ?? "bg-neutral-100";
// マスの大きさは GitHub と同じくらい。月名の段とマスの段を同じ grid に並べる
const GRASS_ROWS = "grid-rows-[16px_repeat(7,11px)] sm:grid-rows-[16px_repeat(7,12px)] gap-[3px]";
const GRASS_CELL = "block size-[11px] sm:size-3 rounded-[2px]";
const WEEK = 7 * 86400000;
const addDays = (d, n) => {
  const x = new Date(`${d}T00:00:00Z`);
  x.setUTCDate(x.getUTCDate() + n);
  return x.toISOString().slice(0, 10);
};
const sunday = (d) => addDays(d, -new Date(`${d}T00:00:00Z`).getUTCDay());

// 最初の日記がある週から grassUntil の週までを、日曜始まりで1週1列に並べる。
// 期間は絞り込む前の全件で決め、色は絞り込んだ日記で付ける。期間の外のマスは描かない
function grass(shown) {
  if (!entries.length) return "";
  const first = entries.reduce((m, e) => (e.diary_date < m ? e.diary_date : m), entries[0].diary_date);
  const counts = new Map();
  for (const e of shown) counts.set(e.diary_date, (counts.get(e.diary_date) ?? 0) + 1);
  const start = sunday(first);
  const weeks = Math.round((Date.parse(sunday(grassUntil)) - Date.parse(start)) / WEEK) + 1;
  const focus = "outline-none focus-visible:ring-2 focus-visible:ring-border-ring";
  // 月の頭が入る週の列に月名を出す。最初の列には、すぐ後ろ2列に月名が来なければ出す
  const label = (w) => {
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, w * 7 + i);
      if (d.endsWith("-01") && d >= first && d <= grassUntil) return L().month(Number(d.slice(5, 7)));
    }
    return "";
  };
  let cols = "";
  for (let w = 0; w < weeks; w++) {
    const name = label(w) || (w === 0 && !label(1) && !label(2) ? L().month(Number(first.slice(5, 7))) : "");
    cols += `<span class="self-end whitespace-nowrap text-[10px] leading-none text-text-low">${name}</span>`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, w * 7 + i);
      if (d < first || d > grassUntil) {
        cols += `<span aria-hidden="true"></span>`;
        continue;
      }
      const n = counts.get(d) ?? 0;
      const tip = esc(L().cell(`${Number(d.slice(5, 7))}/${Number(d.slice(8))}`, wday(d), n));
      // リンクのマスは outline-none でフォーカスの枠を消しているので、今日の枠は ring で描く
      const today = d === grassToday ? "ring-1 ring-offset-1 ring-neutral-800" : "";
      cols += n
        ? `<a class="${GRASS_CELL} ${grassColor(n)} ${today} transition-opacity hover:opacity-70 ${focus}" href="#d-${d}" title="${tip}" aria-label="${tip}"></a>`
        : `<span class="${GRASS_CELL} ${grassColor(0)} ${today}" title="${tip}"></span>`;
    }
  }
  const wdays = L().grassWeekdays.map((x) => `<span></span><span class="flex items-center">${x}</span>`).join("");
  const legend = [0, 1, 3, 7, 13].map((n) => `<span class="${GRASS_CELL} ${grassColor(n)}"></span>`).join("");
  // 草は日記のある週の分しか幅がないので、件数と凡例を草の右に置く。草が広がって入りきらなくなったら下に回る
  return `<section class="flex flex-wrap items-end gap-x-10 gap-y-3 pt-6 pb-5 border-b border-divider-low" aria-label="${L().grass}">
    <div class="flex gap-1 min-w-0 max-w-full">
      <div class="grid ${GRASS_ROWS} w-6 shrink-0 text-[10px] leading-none text-text-low" aria-hidden="true"><span></span>${wdays}</div>
      <div class="min-w-0 overflow-x-auto" data-grass-scroll>
        <!-- 右の余白は、最後の列の月名と今日の枠がはみ出して横スクロールにならないため -->
        <div class="grid grid-flow-col ${GRASS_ROWS} auto-cols-[11px] sm:auto-cols-[12px] w-max pr-4">${cols}</div>
      </div>
    </div>
    <div class="grid gap-2 pb-0.5">
      <span class="character-4-regular-pro text-text-high">${L().total(shown.length, counts.size)}</span>
      ${grassMeta ? `<span class="character-1-regular-pro text-text-low">${grassMeta}</span>` : ""}
      <span class="flex items-center gap-[3px] character-1-regular-pro text-text-low" aria-hidden="true"><span class="mr-1">${L().grassLess}</span>${legend}<span class="ml-1">${L().grassMore}</span></span>
    </div>
  </section>`;
}

function drawGrass(shown) {
  const box = $("grass");
  box.innerHTML = grass(shown);
  // 入りきらないときは最新の週がある右端から見せる
  const scroller = box.querySelector("[data-grass-scroll]");
  if (scroller) scroller.scrollLeft = scroller.scrollWidth;
}

// ---------- 日記の一覧 ----------

// リポジトリ名の前に付ける色。名前から決めるので、同じリポジトリはいつも同じ色になる
const REPO_DOTS = ["bg-blue-500", "bg-green-500", "bg-orange-500", "bg-purple-500", "bg-pink-500", "bg-red-500", "bg-yellow-500"];
function repoDot(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.codePointAt(0)) >>> 0;
  return REPO_DOTS[h % REPO_DOTS.length];
}

// 日記1件を1行にする。閉じているときはタイトルと本文の頭とリポジトリ、押すとその場で全文と項目別の一覧が開く
function row(e, d) {
  const focus = "outline-none focus-visible:ring-2 focus-visible:ring-border-ring focus-visible:ring-offset-2";
  const startDay = e.span_started_at ? tokyoDay(e.span_started_at) : d;
  const span = e.span_started_at
    ? `${startDay !== d ? `${Number(startDay.slice(5, 7))}/${Number(startDay.slice(8))} ` : ""}${hm(e.span_started_at)}〜${hm(e.ended_at)}`
    : hm(e.ended_at);
  const repo = e.cc_sessions?.project_name;
  const branch = e.cc_sessions?.git_branch;
  const sec = (key, label, items) => {
    const [name, color] = SECTION[key];
    return `<div><h4 class="flex items-center gap-1.5 character-2-bold-pro text-text-high">${ui.icon(name, 4, { cls: color })}${label}</h4>
      <ul class="mt-1 pl-6 list-disc marker:text-neutral-300 character-2-regular-pro text-text-middle leading-relaxed">${items}</ul></div>`;
  };
  const li = (xs) => xs.map((x) => `<li class="py-0.5">${inline(x)}</li>`).join("");
  const lists =
    (e.did.length ? sec("did", L().did, li(e.did)) : "") +
    (e.failed.length ? sec("failed", L().failed, li(e.failed)) : "") +
    (e.learned.length ? sec("learned", L().learned, li(e.learned)) : "") +
    (e.open_threads.length ? sec("open", L().open, li(e.open_threads)) : "") +
    (e.pr_urls.length ? sec("pr", "PR", e.pr_urls.map((u) => `<li class="py-0.5 break-all">${ui.externalLink(esc(u), esc(u.replace("https://github.com/", "")), 2)}</li>`).join("")) : "") +
    (e.files_touched.length ? sec("files", L().files, e.files_touched.map((f) => `<li class="py-0.5"><code>${esc(f)}</code></li>`).join("")) : "");
  return `<li><details class="group">
    <summary class="group/row block cursor-pointer py-5 rounded-notice ${focus}">
      <div class="flex items-start gap-3">
        <h3 class="flex-1 min-w-0 character-4-bold-pro text-primary-600 group-hover/row:underline underline-offset-2">${esc(e.title)}</h3>
        ${ui.icon("expand_more", 5, { cls: "mt-0.5 shrink-0 text-neutral-500 transition-transform group-open:rotate-180" })}
      </div>
      <p class="mt-1 line-clamp-2 character-3-regular-pro text-text-middle group-open:hidden">${inline(e.body.replace(/\s*\n+\s*/g, " "))}</p>
      <div class="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1 character-2-regular-pro text-text-low">
        ${repo ? `<span class="inline-flex items-center gap-1.5"><span class="size-3 rounded-full ${repoDot(repo)}" aria-hidden="true"></span>${esc(repo)}</span>` : ""}
        <span class="character-2-regular-mono tabular-nums">${span}</span>
        ${branch ? `<span class="inline-flex items-center gap-0.5 min-w-0 character-2-regular-mono">${ui.icon("call_split", 3)}<span class="truncate">${esc(branch)}</span></span>` : ""}
      </div>
    </summary>
    <div class="pb-6">
      <div class="diary-body">${e.body.split(/\n{2,}/).map((p) => `<p>${inline(p).replace(/\n/g, "<br>")}</p>`).join("")}</div>
      <div class="flex flex-wrap items-center gap-1.5 mt-4">
        ${e.tags.map((t) => `<button class="${ui.tagButton}" type="button" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}
        <span class="ml-auto character-1-regular-pro text-text-low">${L().meta(e.stats?.user_prompts ?? "?", e.stats?.tool_calls ?? "?")}</span>
      </div>
      ${lists ? `<div class="diary-lists grid gap-4 mt-4 p-4 sm:p-5 rounded-notice bg-neutral-50">${lists}</div>` : ""}
    </div>
  </details></li>`;
}

// 絞り込みのアイコン。スマホで絞り込み中かどうかを色で見せる
const PROJ_ICON = {
  off: "sm:hidden pointer-events-none flex size-10 items-center justify-center rounded-action text-neutral-700",
  on: "sm:hidden pointer-events-none flex size-10 items-center justify-center rounded-action text-primary-500 bg-primary-50",
};

function render() {
  const q = $("q").value.trim().toLowerCase();
  const proj = $("proj").value;
  const shown = entries.filter((e) => {
    if (proj && e.cc_sessions?.project_name !== proj) return false;
    if (!q) return true;
    const hay = [e.title, e.body, ...e.did, ...e.failed, ...e.learned, ...e.open_threads, ...e.tags, e.cc_sessions?.project_name].join("\n").toLowerCase();
    return hay.includes(q);
  });
  $("projIcon").className = proj ? PROJ_ICON.on : PROJ_ICON.off;
  drawGrass(shown);
  const stream = $("stream");
  if (shown.length === 0) {
    stream.innerHTML = `<div class="flex flex-col items-center gap-2 py-16 text-center text-text-low">${ui.icon("search_off", 8)}<p class="character-2-regular-pro">${entries.length ? L().empty : L().none}</p></div>`;
    return;
  }
  const days = new Map();
  for (const e of shown) {
    if (!days.has(e.diary_date)) days.set(e.diary_date, []);
    days.get(e.diary_date).push(e);
  }
  // 日の見出しはヘッダーの下に貼り付いて、長い日でも今どの日を読んでいるかが分かる
  let html = "";
  let i = 0;
  for (const [d, list] of days) {
    html += `<section class="day scroll-mt-[calc(3.5rem+env(safe-area-inset-top))]" id="d-${d}" style="animation-delay:${Math.min(i++, 6) * 50}ms">
      <h2 class="sticky top-[calc(3.5rem+env(safe-area-inset-top))] z-10 -mx-4 sm:-mx-6 px-4 sm:px-6 pt-6 bg-white/95 backdrop-blur">
        <span class="flex items-baseline gap-3 pb-2 border-b border-divider-middle">
          <span class="character-6-bold-mono text-text-high tabular-nums">${Number(d.slice(5, 7))}.${d.slice(8)}</span>
          <span class="character-2-regular-pro text-text-low">${L().dayMeta(d.slice(0, 4), wday(d), list.length)}</span>
        </span>
      </h2>
      <ul class="divide-y divide-divider-low">${list.map((e) => row(e, d)).join("")}</ul>
    </section>`;
  }
  stream.innerHTML = html;
}

// metaHtml は草の見出しの右に出す。until は草の右端の日、today は枠を付ける日（デモでは空）
function start(list, metaHtml, calloutHtml = "", { until, today = "" } = {}) {
  entries = list;
  grassMeta = metaHtml;
  grassUntil = until;
  grassToday = today;
  $("counts").textContent = "";
  $("logoText").className = "hidden sm:inline";
  root.innerHTML = `
    <div class="mx-auto max-w-[800px] px-4 sm:px-6 pb-24">
      <div id="grass"></div>
      <main>${calloutHtml ? `<div class="pt-6">${calloutHtml}</div>` : ""}<div id="stream"></div></main>
    </div>`;
  // 絞り込みは日記の多いリポジトリから並べる
  const repos = new Map();
  for (const e of entries) {
    const p = e.cc_sessions?.project_name;
    if (p) repos.set(p, (repos.get(p) ?? 0) + 1);
  }
  const sorted = [...repos].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  $("proj").innerHTML = `<option value="">${L().all}</option>` + sorted.map(([p, n]) => `<option value="${esc(p)}">${esc(L().option(p, n))}</option>`).join("");
  $("q").placeholder = L().search;
  $("tools").hidden = false;
  render();
}

// 検索欄と絞り込み。Sparkle の Input と Select の見た目。
// スマホでは絞り込みをアイコンにして、透明にした select をその上に重ねる
$("qWrap").insertAdjacentHTML("beforeend", `<div class="${ui.input.wrap} ${ui.input.md}">${ui.icon("search", 5, { cls: "pl-1.5 text-neutral-500" })}<input class="${ui.input.field}" id="q" type="search" placeholder="検索" autocomplete="off" enterkeyhint="search"></div>`);
$("projWrap").innerHTML = `<div class="${ui.select.wrap} size-full rounded-action has-[:focus-visible]:max-sm:ring-2 has-[:focus-visible]:max-sm:ring-border-ring">
  <select class="${ui.select.field} max-sm:absolute max-sm:inset-0 max-sm:opacity-0" id="proj" aria-label="プロジェクト"><option value="">すべて</option></select>
  ${ui.icon("expand_more", 5, { cls: `${ui.select.icon} max-sm:hidden` })}
  <span class="${PROJ_ICON.off}" id="projIcon">${ui.icon("filter_list", 5)}</span>
</div>`;

root.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-tag]");
  if (t) {
    $("q").value = t.dataset.tag;
    render();
    window.scrollTo({ top: 0 });
    return;
  }
  if (ev.target.closest("[data-register]")) openRegister();
});
$("q").addEventListener("input", () => render());
$("proj").addEventListener("change", () => render());

// ---------- 画面の切り替え ----------

function showLocked(stats) {
  $("counts").textContent = visitorsText(stats);
  notice("閉じています", "この日記は、持ち主だけが読める。", `
    <div class="mt-6 flex flex-col gap-2 sm:flex-row sm:justify-center">
      <a class="${ui.button()}" href="?demo&lang=ja">${ui.buttonIcon("visibility")}デモを見る</a>
      <a class="${ui.button({ variant: "outline", theme: "neutral" })}" href="?demo&lang=en" lang="en">See the demo in English</a>
    </div>
    <details class="group mt-10 border-t border-divider-middle pt-4">
      <summary class="${ui.button({ variant: "ghost", theme: "neutral", size: "sm" })} mx-auto w-fit">${ui.buttonIcon("key", "sm")}持ち主ならメールでログイン${ui.icon("expand_more", 3, { cls: "ml-1 transition-transform group-open:rotate-180" })}</summary>
      <div class="${ui.card.base} mt-4 p-6" id="loginForm"></div>
      <p class="mt-3 character-1-regular-pro text-text-low">エージェントは<a class="underline text-primary-500" href="./skill.md">skill.md</a>の手順でログインする。</p>
    </details>`, { icon: "lock" });
  codeForm($("loginForm"), {
    sendLabel: "コードを送る",
    // 登録済みのアドレスにだけ送る。知らないアドレスでユーザーを作らない
    send: async (email) => {
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: PAGE_URL } });
      if (error) throw error;
    },
    verify: async (email, token) => {
      const { error } = await sb.auth.verifyOtp({ email, token, type: "email" });
      if (error) throw error;
    },
    done: async () => location.replace(PAGE_URL),
  });
}

// 検索エンジンのボットはJSを実行するので、そのままだとクロールのたびに匿名ユーザーと訪問の記録が増える
const IS_BOT = /(bot|crawler|spider)\b|Google-InspectionTool|Lighthouse/i.test(navigator.userAgent);

async function main() {
  const demo = new URLSearchParams(location.search).has("demo");
  // ボットはログインしない。user が null のままなので、デモでも訪問を記録しない
  let user = null;
  try {
    if (!IS_BOT) user = await currentUser();
  } catch (e) {
    if (!demo) {
      notice("つながらない", `Supabase に接続できなかった。${e.message ?? e}`, "", { icon: "cloud_off", bad: true });
      return;
    }
  }
  if (demo) {
    LANG = demoLang();
    document.documentElement.lang = LANG;
    const stats = user ? await recordVisit("demo") : null;
    const sw = L().switchTo;
    const link = $("langLink");
    link.className = ui.button({ variant: "ghost", theme: "neutral", size: "sm" });
    link.href = `?demo&lang=${sw.lang}`;
    link.lang = sw.lang;
    link.innerHTML = `${ui.buttonIcon("translate", "sm")}${sw.label}`;
    link.hidden = false;
    const list = LANG === "en" ? DEMO_ENTRIES_EN : DEMO_ENTRIES;
    // デモの日記は日付が決まっているので、草は今日ではなく最後の日記で終える
    start(
      list,
      `<span class="${ui.tag.base} ${ui.tag.warning} mr-1">${L().demo}</span>${L().basis}${stats ? ` · ${L().visitors(stats.visitors)}` : ""}`,
      ABOUT[LANG],
      { until: list.reduce((m, e) => (e.diary_date > m ? e.diary_date : m), list[0].diary_date) },
    );
    return;
  }
  if (IS_BOT) {
    showLocked(null);
    return;
  }
  let owner;
  try {
    owner = await claimOwner();
  } catch (e) {
    notice("つながらない", `Supabase に接続できなかった。${e.message ?? e}`, "", { icon: "cloud_off", bad: true });
    return;
  }
  if (!owner) {
    showLocked(await recordVisit("locked"));
    return;
  }
  const visitStats = await recordVisit("owner");
  setupAccount(user);
  const [{ data, error }, { data: queue }] = await Promise.all([
    sb.from("diary_entries")
      .select("id, diary_date, ended_at, span_started_at, title, body, did, failed, learned, open_threads, tags, pr_urls, files_touched, stats, cc_sessions(project_name, git_branch)")
      .eq("status", "written")
      .order("ended_at", { ascending: false })
      .limit(2000),
    sb.from("diary_entries").select("status").neq("status", "written"),
  ]);
  if (error) {
    notice("読めなかった", error.message, "", { icon: "error", bad: true });
    return;
  }
  const pending = (queue ?? []).filter((r) => r.status === "pending" || r.status === "generating").length;
  const failed = (queue ?? []).filter((r) => r.status === "failed").length;
  const meta = [pending ? `生成待ち ${pending}` : "", failed ? `<span class="text-negative-500">失敗 ${failed}</span>` : "", visitorsText(visitStats)].filter(Boolean).join(" · ");
  const today = tokyoDay(Date.now());
  const latest = data.length ? data[0].diary_date : today;
  const callout = user.is_anonymous
    ? `<div class="${ui.inlineMessage.info} mb-6" data-callout role="status">
        <span class="${ui.inlineMessage.icon}">${ui.icon("info", 6)}</span>
        <p class="${ui.inlineMessage.body}">今はこの端末でだけ読める。<button class="${ui.link} cursor-pointer" type="button" data-register>メールを登録</button>すると、他の端末でも読める。</p>
      </div>`
    : "";
  // 端末の時計がずれていても最新の日記が草からはみ出さないよう、遅い方を右端にする
  start(data, meta, callout, { until: latest > today ? latest : today, today });
}

main();
