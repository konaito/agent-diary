<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdfcf8">
<title>agent-diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fdfcf8;
    --paper-2: #f4f0e6;
    --ink: #1d1b18;
    --ink-soft: #5d5850;
    --ink-faint: #9a948a;
    --rule: #e6e1d6;
    --shu: #c23b22;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    --gutter: 16px;
    --bar: 52px;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background: var(--paper);
    font-family: var(--serif);
    font-size: 16.5px;
    line-height: 1.95;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ---------- 上部のバー ---------- */
  .bar {
    position: sticky; top: 0; z-index: 3;
    display: flex; align-items: center; gap: 12px;
    min-height: var(--bar);
    padding: env(safe-area-inset-top) var(--gutter) 0;
    background: rgba(253, 252, 248, .94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rule);
  }
  .brand { font: 14px var(--mono); letter-spacing: .08em; text-decoration: none; }
  .brand b { color: var(--shu); font-weight: 500; }
  .counts { font: 12px var(--mono); color: var(--ink-faint); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .counts .warn { color: var(--shu); }
  .counts a { color: var(--ink-soft); }
  .acct-btn {
    margin-left: auto; flex: none;
    font: 12px var(--mono); color: var(--ink-soft);
    min-height: 44px; padding: 0 2px;
  }
  .lang-link { display: inline-flex; align-items: center; text-decoration: none; color: var(--shu); }
  .acct-btn .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--shu); margin-right: 6px; vertical-align: 1px; }

  /* ---------- 検索と絞り込み ---------- */
  .filters { display: flex; gap: 10px; padding: 10px var(--gutter) 4px; }
  .filters[hidden] { display: none; }
  .filters input, .filters select {
    font: 16px var(--mono); color: var(--ink);
    background: transparent; border: 0; border-bottom: 1px solid var(--ink-faint);
    padding: 8px 2px; outline: none; border-radius: 0; min-width: 0;
    -webkit-appearance: none; appearance: none;
  }
  .filters input { flex: 1; }
  .filters select { flex: 0 1 40%; background: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%) right 6px center / 6px 6px no-repeat; padding-right: 18px; }
  .filters input:focus, .filters select:focus { border-bottom-color: var(--shu); }

  /* ---------- 日付の帯（スマホ） ---------- */
  .strip { display: flex; gap: 6px; overflow-x: auto; padding: 10px var(--gutter) 6px; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .strip a {
    flex: none; text-decoration: none;
    display: grid; justify-items: center;
    min-width: 52px; padding: 6px 8px;
    border: 1px solid var(--rule); border-radius: 3px;
    font: 11px/1.3 var(--mono); color: var(--ink-faint);
  }
  .strip a b { font: 800 18px/1.2 var(--serif); color: var(--ink); }
  .strip a:active { border-color: var(--shu); }

  /* ---------- 本文 ---------- */
  .stream { padding: 8px var(--gutter) 96px; }
  .day { margin: 18px 0 56px; scroll-margin-top: calc(var(--bar) + 12px); animation: rise .45s ease both; }
  .day-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0 0 4px; }
  .day-num { font: 800 44px/1 var(--serif); color: var(--shu); letter-spacing: -.02em; }
  .day-meta { font: 12px/1.6 var(--mono); color: var(--ink-faint); }

  .entry { padding: 18px 0 20px; border-top: 1px solid var(--rule); }
  .entry h2 { font: 600 19px/1.55 var(--serif); margin: 0 0 4px; }
  .entry .meta { font: 11.5px/1.7 var(--mono); color: var(--ink-faint); margin-bottom: 10px; }
  .entry .meta .proj { color: var(--ink-soft); }
  .entry .body p { margin: 0 0 .9em; }
  code { font: .84em var(--mono); background: var(--paper-2); padding: 1px 4px; border-radius: 2px; word-break: break-all; }

  details { margin-top: 2px; }
  summary {
    cursor: pointer; list-style: none;
    display: inline-flex; align-items: center; min-height: 44px;
    font: 12.5px var(--mono); color: var(--ink-soft);
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "＋"; color: var(--shu); margin-right: 6px; }
  details[open] summary::before { content: "－"; }
  .lists { display: grid; gap: 14px; margin: 4px 0 6px; padding-left: 12px; border-left: 2px solid var(--rule); }
  .lists h3 { font: 500 11px var(--mono); letter-spacing: .1em; color: var(--ink-soft); margin: 0; }
  .lists h3.bad { color: var(--shu); }
  .lists ul { margin: 2px 0 0; padding-left: 1.1em; font-size: 15px; line-height: 1.8; }
  .lists a { word-break: break-all; }
  .tags { display: flex; flex-wrap: wrap; gap: 0 4px; margin-top: 4px; }
  .tags button { font: 12px var(--mono); color: var(--ink-faint); min-height: 36px; padding: 0 6px 0 0; }
  .tags button:active { color: var(--shu); }

  /* ---------- お知らせ、ログイン ---------- */
  .callout {
    margin: 14px 0 4px; padding: 12px 14px;
    background: var(--paper-2); border-left: 3px solid var(--shu);
    font-size: 14.5px; line-height: 1.8;
  }
  .callout button { color: var(--shu); text-decoration: underline; font-family: var(--mono); font-size: 13px; }
  /* ---------- デモの説明 ---------- */
  .about { margin: 12px 0 44px; padding: 20px 18px 8px; background: #fff; border: 1px solid var(--rule); border-radius: 4px; }
  .about .kicker { font: 11px var(--mono); letter-spacing: .12em; color: var(--shu); }
  .about h2 { font: 800 24px/1.45 var(--serif); margin: 4px 0 10px; }
  .about p { font-size: 15.5px; line-height: 1.9; margin: 0 0 .9em; color: var(--ink-soft); }
  .about p strong { color: var(--ink); font-weight: 600; }
  .about ol { list-style: none; counter-reset: step; margin: 6px 0 16px; padding: 0; display: grid; gap: 10px; }
  .about li { counter-increment: step; display: grid; grid-template-columns: 28px 1fr; gap: 0 8px; font-size: 14.5px; line-height: 1.75; }
  .about li::before { content: counter(step, decimal-leading-zero); font: 500 12px/2 var(--mono); color: var(--shu); }
  .about .links { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 10px 0 12px; border-top: 1px dashed var(--rule); }
  .about .links a { font: 13px var(--mono); color: var(--shu); min-height: 36px; display: inline-flex; align-items: center; }
  .notice { padding: 14vh var(--gutter) 40px; text-align: center; }
  .notice .big { font: 800 40px/1.3 var(--serif); color: var(--shu); }
  .notice p { color: var(--ink-soft); margin: 10px 0; }
  .demo-link { font: 14px var(--mono); color: var(--shu); }
  .empty { color: var(--ink-faint); font: 13px var(--mono); padding: 24px 0; }

  .form { display: grid; gap: 10px; text-align: left; max-width: 360px; margin: 28px auto 0; }
  .form label { font: 12px var(--mono); color: var(--ink-soft); }
  .form input {
    font: 16px var(--mono); color: var(--ink);
    padding: 12px; border: 1px solid var(--rule); border-radius: 3px; background: #fff; outline: none; width: 100%;
  }
  .form input:focus { border-color: var(--shu); }
  .form input.code { letter-spacing: .3em; text-align: center; font-size: 20px; }
  .btn {
    min-height: 46px; border-radius: 3px;
    background: var(--ink); color: var(--paper);
    font: 14px var(--mono); letter-spacing: .04em;
  }
  .btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--rule); }
  .btn:disabled { opacity: .5; }
  .msg { font: 12.5px/1.7 var(--mono); color: var(--ink-soft); min-height: 1.7em; }
  .msg.err { color: var(--shu); }
  .fold { margin-top: 36px; }
  .fold summary { justify-content: center; width: 100%; }

  /* ---------- アカウント（下から出るシート） ---------- */
  .sheet-bg { position: fixed; inset: 0; z-index: 5; background: rgba(29, 27, 24, .28); }
  .sheet {
    position: fixed; z-index: 6; left: 0; right: 0; bottom: 0;
    max-height: 85vh; overflow: auto;
    background: var(--paper);
    border-top: 1px solid var(--rule);
    border-radius: 10px 10px 0 0;
    padding: 18px var(--gutter) calc(24px + env(safe-area-inset-bottom));
    animation: up .22s ease both;
  }
  .sheet[hidden], .sheet-bg[hidden] { display: none; }
  .sheet h2 { font: 600 18px var(--serif); margin: 0 0 6px; }
  .sheet p { font-size: 14.5px; color: var(--ink-soft); margin: 0 0 6px; }
  .sheet .form { margin: 14px 0 0; max-width: none; }
  .sheet .close { position: absolute; right: 8px; top: 6px; min-width: 44px; min-height: 44px; font: 20px var(--mono); color: var(--ink-faint); }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes up { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- 広い画面 ---------- */
  @media (min-width: 960px) {
    :root { --gutter: 48px; }
    .filters { position: absolute; top: env(safe-area-inset-top); right: 190px; height: var(--bar); align-items: center; padding: 0; z-index: 4; }
    .filters input { width: 220px; flex: none; font-size: 14px; }
    .filters select { flex: none; font-size: 14px; }
    .layout { display: grid; grid-template-columns: 132px minmax(0, 40em); gap: 0 64px; padding: 24px var(--gutter) 0; }
    .strip { display: none; }
    .index { display: block !important; position: sticky; top: calc(var(--bar) + 24px); align-self: start; max-height: calc(100vh - 100px); overflow: auto; }
    .stream { padding: 0 0 120px; }
    .day-num { font-size: 64px; }
    .entry h2 { font-size: 21px; }
    .entry .body p { text-align: justify; }
    .sheet { left: auto; right: 24px; top: calc(var(--bar) + 8px); bottom: auto; width: 380px; border: 1px solid var(--rule); border-radius: 6px; }
  }
  .index { display: none; }
  .index a { display: flex; justify-content: space-between; font: 12px/2.1 var(--mono); color: var(--ink-faint); text-decoration: none; }
  .index a:hover { color: var(--shu); }
  .index .month { font: 600 12px/2.6 var(--mono); color: var(--ink-soft); margin-top: 8px; }
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="./">agent<b>/</b>diary</a>
  <div class="counts" id="counts"></div>
  <a class="acct-btn lang-link" id="langLink" hidden></a>
  <button class="acct-btn" id="acctBtn" hidden></button>
</header>
<div class="filters" id="tools" hidden>
  <input id="q" type="search" placeholder="検索" autocomplete="off" enterkeyhint="search">
  <select id="proj" aria-label="プロジェクト"><option value="">すべて</option></select>
</div>
<div id="root"><div class="notice"><p>読み込み中</p></div></div>
<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm";
import { SUPABASE_KEY, SUPABASE_URL } from "./config.js";
import { DEMO_ENTRIES, DEMO_ENTRIES_EN } from "./demo.js";

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  // 保存名は改名前のまま。変えると、今ログインしているブラウザが持ち主として読めなくなる
  auth: { storageKey: "cc-diary-auth", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
});
const $ = (id) => document.getElementById(id);
const root = $("root");
// ---------- 言語 ----------
// 日記の持ち主の画面は日本語。デモだけ英語と日本語を切り替えられる
const I18N = {
  ja: {
    weekdays: ["日", "月", "火", "水", "木", "金", "土"],
    search: "検索",
    all: "すべて",
    empty: "該当する日記はない。",
    none: "日記はまだない。Claude Codeのセッションを閉じると、ここに増える。",
    dayMeta: (y, wd, n) => `${y} ${wd}曜 · ${n}件`,
    index: (day, wd) => `${day}日（${wd}）`,
    meta: (p, t) => `依頼 ${p} · ツール ${t}`,
    more: "くわしく",
    did: "やったこと",
    failed: "うまくいかなかったこと",
    learned: "分かったこと",
    open: "残っていること",
    files: "書き込んだファイル",
    demo: "デモ",
    basis: "架空の日記",
    visitors: (n) => `訪れた人 ${n}`,
    switchTo: { lang: "en", label: "English" },
  },
  en: {
    weekdays: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
    search: "Search",
    all: "All",
    empty: "No matching entries.",
    none: "No entries yet.",
    dayMeta: (y, wd, n) => `${y} ${wd} · ${n} ${n === 1 ? "entry" : "entries"}`,
    index: (day, wd) => `${wd} ${day}`,
    meta: (p, t) => `${p} requests · ${t} tool calls`,
    more: "Details",
    did: "Done",
    failed: "Didn't work",
    learned: "Learned",
    open: "Still open",
    files: "Files written",
    demo: "Demo",
    basis: "fictional entries",
    visitors: (n) => `${n} ${n === 1 ? "visitor" : "visitors"}`,
    switchTo: { lang: "ja", label: "日本語" },
  },
};
let LANG = "ja";
const L = () => I18N[LANG];

// デモの言語。?lang= の指定、前回選んだ言語、ブラウザの言語の順で決める
function demoLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "en" || q === "ja") {
    try { localStorage.setItem("agent-diary-lang", q); } catch {}
    return q;
  }
  try {
    const saved = localStorage.getItem("agent-diary-lang");
    if (saved === "en" || saved === "ja") return saved;
  } catch {}
  return (navigator.languages?.[0] ?? navigator.language ?? "ja").toLowerCase().startsWith("ja") ? "ja" : "en";
}
const PAGE_URL = location.origin + location.pathname;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const hm = (iso) => new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso));
// 日付文字列の曜日。暦日として UTC で計算するのでブラウザのタイムゾーンに左右されない
const wday = (d) => L().weekdays[new Date(`${d}T00:00:00Z`).getUTCDay()];
const tokyoDay = (iso) => new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Tokyo" }).format(new Date(iso));

// Supabase のエラーを短い日本語にする
function authMessage(e) {
  const code = e?.code ?? "";
  const m = e?.message ?? String(e);
  if (code === "otp_disabled" || /signups not allowed/i.test(m)) return "このアドレスは持ち主として登録されていない。";
  if (code === "email_address_not_authorized") return "このアドレスには送れない。Supabase の標準のメール送信は、組織のメンバーのアドレスにだけ送れる。";
  if (code === "over_email_send_rate_limit" || /rate limit/i.test(m)) return "メールの送信回数の上限に達した（1時間に2通）。しばらく待ってからやり直す。";
  if (code === "otp_expired" || /expired|invalid/i.test(m)) return "コードが違うか、期限が切れている。";
  if (code === "email_exists" || /already been registered/i.test(m)) return "このアドレスは別のユーザーで登録済み。";
  return m;
}

function notice(big, text, extraHtml = "") {
  root.innerHTML = `<div class="notice"><div class="big">${esc(big)}</div><p>${esc(text)}</p>${extraHtml}</div>`;
}

// ---------- 認証 ----------

// 訪問者は全員匿名ログインする。訪れた人数は匿名ユーザーの数で数える
async function currentUser() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) return session.user;
  const { data, error } = await sb.auth.signInAnonymously();
  if (error) throw error;
  return data.user;
}

// 持ち主かどうかを返す。持ち主が決まっていなければ、このユーザーが持ち主になる
async function claimOwner() {
  const { data, error } = await sb.rpc("claim_site");
  if (error) throw error;
  return data === true;
}

// 訪問を記録して、訪れた人数を返す。数えられなくても画面は出す
async function recordVisit(view) {
  const { data, error } = await sb.rpc("record_visit", { p_view: view });
  return error ? null : data;
}
const visitorsText = (stats) => (stats ? `訪れた人 ${stats.visitors}` : "");

// メールアドレスにコードを送り、入力されたコードで確認するフォーム。
// send(email) はコードを送る処理、verify(email, token) は確認する処理
function codeForm(container, { intro, sendLabel, send, verify, done }) {
  container.innerHTML = `
    <form class="form" data-step="email">
      ${intro ? `<p>${esc(intro)}</p>` : ""}
      <label for="em">メールアドレス</label>
      <input id="em" type="email" inputmode="email" autocomplete="email" required>
      <button class="btn" type="submit">${esc(sendLabel)}</button>
      <div class="msg" aria-live="polite"></div>
    </form>`;
  const form = container.querySelector("form");
  const msg = form.querySelector(".msg");
  let email = "";
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = form.querySelector("button");
    btn.disabled = true;
    msg.className = "msg";
    try {
      if (form.dataset.step === "email") {
        email = form.querySelector("#em").value.trim();
        msg.textContent = "送っている";
        if ((await send(email)) === "done") {
          await done();
          return;
        }
        form.dataset.step = "code";
        form.innerHTML = `
          <p>${esc(email)} にコードを送った。メールに書いてある数字を入れる。</p>
          <label for="code">コード</label>
          <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="10" required>
          <button class="btn" type="submit">確認する</button>
          <div class="msg" aria-live="polite"></div>`;
        form.querySelector("#code").focus();
      } else {
        const token = form.querySelector("#code").value.replace(/\s/g, "");
        await verify(email, token);
        await done();
      }
    } catch (e) {
      const m = form.querySelector(".msg");
      m.className = "msg err";
      m.textContent = authMessage(e);
    } finally {
      const b = form.querySelector("button");
      if (b) b.disabled = false;
    }
  });
}

// ---------- アカウントのシート ----------

function openSheet(html, setup) {
  $("sheet").innerHTML = `<button class="close" aria-label="閉じる">×</button>${html}`;
  $("sheet").hidden = false;
  $("sheetBg").hidden = false;
  $("sheet").querySelector(".close").onclick = closeSheet;
  setup?.($("sheet"));
}
function closeSheet() {
  $("sheet").hidden = true;
  $("sheetBg").hidden = true;
}
$("sheetBg").onclick = closeSheet;

function setupAccount(user) {
  const btn = $("acctBtn");
  btn.hidden = false;
  if (user.is_anonymous) {
    btn.innerHTML = `<span class="dot"></span>メール未登録`;
    btn.onclick = () => openRegister();
  } else {
    btn.textContent = "アカウント";
    btn.onclick = () =>
      openSheet(
        `<h2>アカウント</h2><p>${esc(user.email)} でログインしている。他の端末では、このアドレスに届くコードでログインできる。</p>
         <div class="form"><button class="btn ghost" id="logout" type="button">この端末からログアウト</button></div>`,
        (el) => {
          el.querySelector("#logout").onclick = async () => {
            await sb.auth.signOut();
            location.reload();
          };
        },
      );
  }
}

// 匿名の持ち主にメールアドレスを結び付ける。ユーザー ID は変わらないので、持ち主のまま他の端末からもログインできる
function openRegister() {
  openSheet(`<h2>他の端末でも読む</h2><p>今はこの端末のブラウザでだけ読める。メールアドレスを登録すると、スマホや別の PC でもコードでログインできる。</p><div id="regForm"></div>`, (el) => {
    codeForm(el.querySelector("#regForm"), {
      sendLabel: "コードを送る",
      send: async (email) => {
        const { data, error } = await sb.auth.updateUser({ email }, { emailRedirectTo: PAGE_URL });
        if (error) throw error;
        // メール確認がオフの環境では、この時点で登録が終わっている
        if (data.user?.email === email && !data.user.is_anonymous) return "done";
      },
      verify: async (email, token) => {
        const { error } = await sb.auth.verifyOtp({ email, token, type: "email_change" });
        if (error) throw error;
      },
      done: async () => {
        el.querySelector("#regForm").innerHTML = `<p>登録した。他の端末では、ページの「持ち主ならメールでログイン」から入れる。</p>`;
        const { data: { user } } = await sb.auth.getUser();
        if (user) setupAccount(user);
        document.querySelector(".callout")?.remove();
      },
    });
  });
}

// ---------- 日記の表示 ----------

let entries = [];

function render() {
  const q = $("q").value.trim().toLowerCase();
  const proj = $("proj").value;
  const shown = entries.filter((e) => {
    if (proj && e.cc_sessions?.project_name !== proj) return false;
    if (!q) return true;
    const hay = [e.title, e.body, ...e.did, ...e.failed, ...e.learned, ...e.open_threads, ...e.tags, e.cc_sessions?.project_name].join("\n").toLowerCase();
    return hay.includes(q);
  });
  const stream = $("stream");
  if (shown.length === 0) {
    stream.innerHTML = `<p class="empty">${entries.length ? L().empty : L().none}</p>`;
    $("strip").innerHTML = "";
    $("index").innerHTML = "";
    return;
  }
  const days = new Map();
  for (const e of shown) {
    if (!days.has(e.diary_date)) days.set(e.diary_date, []);
    days.get(e.diary_date).push(e);
  }

  let strip = "";
  let index = "";
  let lastMonth = "";
  for (const [d, list] of days) {
    strip += `<a href="#d-${d}"><b>${Number(d.slice(5, 7))}.${d.slice(8)}</b>${wday(d)} ${list.length}</a>`;
    const month = d.slice(0, 7);
    if (month !== lastMonth) {
      index += `<div class="month">${month.replace("-", ".")}</div>`;
      lastMonth = month;
    }
    index += `<a href="#d-${d}"><span>${L().index(Number(d.slice(8)), wday(d))}</span><span>${list.length}</span></a>`;
  }

  let html = "";
  let i = 0;
  for (const [d, list] of days) {
    const projects = [...new Set(list.map((e) => e.cc_sessions?.project_name).filter(Boolean))];
    html += `<section class="day" id="d-${d}" style="animation-delay:${Math.min(i++, 6) * 50}ms">
      <div class="day-head"><span class="day-num">${Number(d.slice(5, 7))}.${d.slice(8)}</span>
      <span class="day-meta">${L().dayMeta(d.slice(0, 4), wday(d), list.length)}<br>${esc(projects.join(" / "))}</span></div>`;
    for (const e of [...list].reverse()) {
      const startDay = e.span_started_at ? tokyoDay(e.span_started_at) : d;
      const span = e.span_started_at
        ? `${startDay !== d ? `${Number(startDay.slice(5, 7))}/${Number(startDay.slice(8))} ` : ""}${hm(e.span_started_at)}〜${hm(e.ended_at)}`
        : hm(e.ended_at);
      const sec = (label, xs, bad) => (xs.length ? `<div><h3 class="${bad ? "bad" : ""}">${label}</h3><ul>${xs.map((x) => `<li>${inline(x)}</li>`).join("")}</ul></div>` : "");
      const lists =
        sec(L().did, e.did) + sec(L().failed, e.failed, true) + sec(L().learned, e.learned) + sec(L().open, e.open_threads) +
        (e.pr_urls.length ? `<div><h3>PR</h3><ul>${e.pr_urls.map((u) => `<li><a href="${esc(u)}" target="_blank" rel="noreferrer">${esc(u.replace("https://github.com/", ""))}</a></li>`).join("")}</ul></div>` : "") +
        (e.files_touched.length ? `<div><h3>${L().files}</h3><ul>${e.files_touched.map((f) => `<li><code>${esc(f)}</code></li>`).join("")}</ul></div>` : "");
      html += `<article class="entry">
        <h2>${esc(e.title)}</h2>
        <div class="meta">${span} · <span class="proj">${esc(e.cc_sessions?.project_name ?? "")}</span>${e.cc_sessions?.git_branch ? ` (${esc(e.cc_sessions.git_branch)})` : ""} · ${L().meta(e.stats?.user_prompts ?? "?", e.stats?.tool_calls ?? "?")}</div>
        <div class="body">${e.body.split(/\n{2,}/).map((p) => `<p>${inline(p).replace(/\n/g, "<br>")}</p>`).join("")}</div>
        ${lists ? `<details><summary>${L().more}</summary><div class="lists">${lists}</div></details>` : ""}
        ${e.tags.length ? `<div class="tags">${e.tags.map((t) => `<button type="button" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}</div>` : ""}
      </article>`;
    }
    html += `</section>`;
  }
  stream.innerHTML = html;
  $("strip").innerHTML = strip;
  $("index").innerHTML = index;
}

function start(list, countsHtml, calloutHtml = "") {
  entries = list;
  $("counts").innerHTML = countsHtml;
  root.innerHTML = `<nav class="strip" id="strip"></nav><div class="layout"><nav class="index" id="index"></nav><main class="stream">${calloutHtml}<div id="stream"></div></main></div>`;
  const projects = [...new Set(entries.map((e) => e.cc_sessions?.project_name).filter(Boolean))].sort();
  $("proj").innerHTML = `<option value="">${L().all}</option>` + projects.map((p) => `<option>${esc(p)}</option>`).join("");
  $("q").placeholder = L().search;
  $("tools").hidden = false;
  render();
}

root.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-tag]");
  if (t) {
    $("q").value = t.dataset.tag;
    render();
    window.scrollTo({ top: 0 });
    return;
  }
  if (ev.target.closest("[data-register]")) openRegister();
});
$("q").addEventListener("input", () => render());
$("proj").addEventListener("change", () => render());

// ---------- デモの説明 ----------

// ---------- 画面の切り替え ----------

function showLocked(stats) {
  $("counts").textContent = visitorsText(stats);
  notice("閉じています", "この日記は、持ち主だけが読める。", `
    <p><a class="demo-link" href="?demo&lang=ja">デモを見る</a> · <a class="demo-link" href="?demo&lang=en" lang="en">See the demo in English</a></p>
    <details class="fold"><summary>持ち主ならメールでログイン</summary><div id="loginForm"></div></details>`);
  codeForm($("loginForm"), {
    sendLabel: "コードを送る",
    // 登録済みのアドレスにだけ送る。知らないアドレスでユーザーを作らない
    send: async (email) => {
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: PAGE_URL } });
      if (error) throw error;
    },
    verify: async (email, token) => {
      const { error } = await sb.auth.verifyOtp({ email, token, type: "email" });
      if (error) throw error;
    },
    done: async () => location.replace(PAGE_URL),
  });
}

async function main() {
  const demo = new URLSearchParams(location.search).has("demo");
  let user = null;
  try {
    user = await currentUser();
  } catch (e) {
    if (!demo) {
      notice("つながらない", `Supabase に接続できなかった。${e.message ?? e}`);
      return;
    }
  }
  if (demo) {
    LANG = demoLang();
    document.documentElement.lang = LANG;
    const stats = user ? await recordVisit("demo") : null;
    const sw = L().switchTo;
    const link = $("langLink");
    link.href = `?demo&lang=${sw.lang}`;
    link.lang = sw.lang;
    link.textContent = sw.label;
    link.hidden = false;
    start(
      LANG === "en" ? DEMO_ENTRIES_EN : DEMO_ENTRIES,
      `<span class="warn">${L().demo}</span> · ${L().basis}${stats ? ` · ${L().visitors(stats.visitors)}` : ""}`,
      ABOUT[LANG],
    );
    return;
  }
  let owner;
  try {
    owner = await claimOwner();
  } catch (e) {
    notice("つながらない", `Supabase に接続できなかった。${e.message ?? e}`);
    return;
  }
  if (!owner) {
    showLocked(await recordVisit("locked"));
    return;
  }
  const visitStats = await recordVisit("owner");
  setupAccount(user);
  const [{ data, error }, { data: queue }] = await Promise.all([
    sb.from("diary_entries")
      .select("id, diary_date, ended_at, span_started_at, title, body, did, failed, learned, open_threads, tags, pr_urls, files_touched, stats, cc_sessions(project_name, git_branch)")
      .eq("status", "written")
      .order("ended_at", { ascending: false })
      .limit(2000),
    sb.from("diary_entries").select("status").neq("status", "written"),
  ]);
  if (error) {
    notice("読めなかった", error.message);
    return;
  }
  const pending = (queue ?? []).filter((r) => r.status === "pending" || r.status === "generating").length;
  const failed = (queue ?? []).filter((r) => r.status === "failed").length;
  const counts = [`${data.length}件`, pending ? `生成待ち ${pending}` : "", failed ? `<span class="warn">失敗 ${failed}</span>` : "", visitorsText(visitStats)].filter(Boolean).join(" · ");
  const callout = user.is_anonymous
    ? `<div class="callout">今はこの端末でだけ読める。<button type="button" data-register>メールを登録</button>すると、他の端末でも読める。</div>`
    : "";
  start(data, counts, callout);
}

main();
</script>
