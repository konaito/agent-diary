<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>agent-diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL,wght@0..1,500&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&display=swap">
<!-- Sparkle Design のトークンと Tailwind から作った CSS。元は styles/app.css で、bun run build:css で作り直す -->
<link rel="stylesheet" href="./sparkle.css">
</head>
<body class="min-h-dvh">
<header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-divider-low pt-[env(safe-area-inset-top)]">
  <div class="mx-auto max-w-[1120px] h-14 px-4 lg:px-8 flex items-center gap-3">
    <a class="flex items-center gap-1.5 shrink-0 text-text-high character-3-bold-pro rounded-minimum outline-none focus-visible:ring-2 focus-visible:ring-border-ring focus-visible:ring-offset-2" href="./">
      <span class="icon-6-fill-1 select-none text-primary-500" aria-hidden="true">auto_stories</span>agent-diary
    </a>
    <div class="min-w-0 truncate character-1-regular-pro text-text-low" id="counts"></div>
    <div class="ml-auto flex items-center gap-1 shrink-0">
      <a id="langLink" hidden></a>
      <button id="acctBtn" type="button" hidden></button>
    </div>
  </div>
</header>
<div class="mx-auto max-w-[1120px] px-4 lg:px-8" id="tools" hidden>
  <div class="flex gap-2 pt-4 lg:ml-[248px] lg:max-w-[720px]">
    <label class="flex-1 min-w-0" id="qWrap">
      <span class="sr-only">検索</span>
    </label>
    <div class="w-[38%] max-w-48 shrink-0" id="projWrap"></div>
  </div>
</div>
<div id="root">
  <div class="mx-auto max-w-[720px] px-4 pt-8 grid gap-4" aria-label="読み込み中">
    <div class="animate-pulse rounded-notice bg-skeleton-fill h-10 w-32"></div>
    <div class="animate-pulse rounded-notice bg-skeleton-fill h-48"></div>
    <div class="animate-pulse rounded-notice bg-skeleton-fill h-48"></div>
  </div>
</div>
<div id="sheetBg" hidden></div>
<section id="sheet" hidden aria-modal="true" role="dialog"></section>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm";
import { SUPABASE_KEY, SUPABASE_URL } from "./config.js";
import { DEMO_ENTRIES, DEMO_ENTRIES_EN } from "./demo.js";
import * as ui from "./ui.js";

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  // 保存名は改名前のまま。変えると、今ログインしているブラウザが持ち主として読めなくなる
  auth: { storageKey: "cc-diary-auth", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
});
const $ = (id) => document.getElementById(id);
const root = $("root");
// ---------- 言語 ----------
// 日記の持ち主の画面は日本語。デモだけ英語と日本語を切り替えられる
const I18N = {
  ja: {
    weekdays: ["日", "月", "火", "水", "木", "金", "土"],
    search: "検索",
    all: "すべて",
    empty: "該当する日記はない。",
    none: "日記はまだない。Claude Codeのセッションを閉じると、ここに増える。",
    dayMeta: (y, wd, n) => `${y} ${wd}曜 · ${n}件`,
    index: (day, wd) => `${day}日（${wd}）`,
    meta: (p, t) => `依頼 ${p} · ツール ${t}`,
    more: "くわしく",
    did: "やったこと",
    failed: "うまくいかなかったこと",
    learned: "分かったこと",
    open: "残っていること",
    files: "書き込んだファイル",
    demo: "デモ",
    basis: "架空の日記",
    visitors: (n) => `訪れた人 ${n}`,
    switchTo: { lang: "en", label: "English" },
  },
  en: {
    weekdays: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
    search: "Search",
    all: "All",
    empty: "No matching entries.",
    none: "No entries yet.",
    dayMeta: (y, wd, n) => `${y} ${wd} · ${n} ${n === 1 ? "entry" : "entries"}`,
    index: (day, wd) => `${wd} ${day}`,
    meta: (p, t) => `${p} requests · ${t} tool calls`,
    more: "Details",
    did: "Done",
    failed: "Didn't work",
    learned: "Learned",
    open: "Still open",
    files: "Files written",
    demo: "Demo",
    basis: "fictional entries",
    visitors: (n) => `${n} ${n === 1 ? "visitor" : "visitors"}`,
    switchTo: { lang: "ja", label: "日本語" },
  },
};
let LANG = "ja";
const L = () => I18N[LANG];

// デモの言語。?lang= の指定、前回選んだ言語、ブラウザの言語の順で決める
function demoLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "en" || q === "ja") {
    try { localStorage.setItem("agent-diary-lang", q); } catch {}
    return q;
  }
  try {
    const saved = localStorage.getItem("agent-diary-lang");
    if (saved === "en" || saved === "ja") return saved;
  } catch {}
  return (navigator.languages?.[0] ?? navigator.language ?? "ja").toLowerCase().startsWith("ja") ? "ja" : "en";
}
const PAGE_URL = location.origin + location.pathname;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const hm = (iso) => new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso));
// 日付文字列の曜日。暦日として UTC で計算するのでブラウザのタイムゾーンに左右されない
const wday = (d) => L().weekdays[new Date(`${d}T00:00:00Z`).getUTCDay()];
const tokyoDay = (iso) => new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Tokyo" }).format(new Date(iso));

// Supabase のエラーを短い日本語にする
function authMessage(e) {
  const code = e?.code ?? "";
  const m = e?.message ?? String(e);
  if (code === "otp_disabled" || /signups not allowed/i.test(m)) return "このアドレスは持ち主として登録されていない。";
  if (code === "email_address_not_authorized") return "このアドレスには送れない。Supabase の標準のメール送信は、組織のメンバーのアドレスにだけ送れる。";
  if (code === "over_email_send_rate_limit" || /rate limit/i.test(m)) return "メールの送信回数の上限に達した（1時間に2通）。しばらく待ってからやり直す。";
  if (code === "otp_expired" || /expired|invalid/i.test(m)) return "コードが違うか、期限が切れている。";
  if (code === "email_exists" || /already been registered/i.test(m)) return "このアドレスは別のユーザーで登録済み。";
  return m;
}

// 画面いっぱいのお知らせ。icon は Material Symbols の名前、bad なら赤くする
function notice(big, text, extraHtml = "", { icon = "info", bad = false } = {}) {
  root.innerHTML = `
    <div class="mx-auto max-w-md px-4 pt-[12vh] pb-16 text-center">
      <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full ${bad ? "bg-negative-50 text-negative-500" : "bg-primary-50 text-primary-500"}">${ui.icon(icon, 8)}</div>
      <h1 class="character-7-bold-pro text-text-high">${esc(big)}</h1>
      <p class="mt-2 character-3-regular-pro text-text-middle">${esc(text)}</p>
      ${extraHtml}
    </div>`;
}

// ---------- 認証 ----------

// 訪問者は全員匿名ログインする。訪れた人数は匿名ユーザーの数で数える
async function currentUser() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) return session.user;
  const { data, error } = await sb.auth.signInAnonymously();
  if (error) throw error;
  return data.user;
}

// 持ち主かどうかを返す。持ち主が決まっていなければ、このユーザーが持ち主になる
async function claimOwner() {
  const { data, error } = await sb.rpc("claim_site");
  if (error) throw error;
  return data === true;
}

// 訪問を記録して、訪れた人数を返す。数えられなくても画面は出す
async function recordVisit(view) {
  const { data, error } = await sb.rpc("record_visit", { p_view: view });
  return error ? null : data;
}
const visitorsText = (stats) => (stats ? `訪れた人 ${stats.visitors}` : "");

// ラベルつきの入力欄。Sparkle の Input と同じ枠
const field = (id, labelText, attrs, { size = "md", cls = "" } = {}) => `
  <label class="${ui.label}" for="${id}">${esc(labelText)}</label>
  <div class="${ui.input.wrap} ${ui.input[size]}"><input class="${ui.input.field} ${cls}" id="${id}" ${attrs}></div>`;

// メールアドレスにコードを送り、入力されたコードで確認するフォーム。
// send(email) はコードを送る処理、verify(email, token) は確認する処理
function codeForm(container, { intro, sendLabel, send, verify, done }) {
  container.innerHTML = `
    <form class="grid gap-2 text-left" data-step="email">
      ${intro ? `<p class="character-2-regular-pro text-text-middle">${esc(intro)}</p>` : ""}
      ${field("em", "メールアドレス", `type="email" inputmode="email" autocomplete="email" required`)}
      <button class="${ui.button()} mt-2 w-full" type="submit">${esc(sendLabel)}</button>
      <div class="${ui.fieldMessage}" data-msg aria-live="polite"></div>
    </form>`;
  const form = container.querySelector("form");
  const msg = form.querySelector("[data-msg]");
  let email = "";
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = form.querySelector("button");
    btn.disabled = true;
    msg.className = ui.fieldMessage;
    try {
      if (form.dataset.step === "email") {
        email = form.querySelector("#em").value.trim();
        msg.textContent = "送っている";
        if ((await send(email)) === "done") {
          await done();
          return;
        }
        form.dataset.step = "code";
        form.innerHTML = `
          <p class="character-2-regular-pro text-text-middle">${esc(email)} にコードを送った。メールに書いてある数字を入れる。</p>
          ${field("code", "コード", `inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="10" required`, { size: "lg", cls: "text-center tracking-[.3em]" })}
          <button class="${ui.button()} mt-2 w-full" type="submit">確認する</button>
          <div class="${ui.fieldMessage}" data-msg aria-live="polite"></div>`;
        form.querySelector("#code").focus();
      } else {
        const token = form.querySelector("#code").value.replace(/\s/g, "");
        await verify(email, token);
        await done();
      }
    } catch (e) {
      const m = form.querySelector("[data-msg]");
      m.className = ui.fieldError;
      m.innerHTML = `${ui.icon("error", 3)}${esc(authMessage(e))}`;
    } finally {
      const b = form.querySelector("button");
      if (b) b.disabled = false;
    }
  });
}

// ---------- アカウントのシート ----------

$("sheetBg").className = ui.dialog.overlay;
$("sheet").className = ui.dialog.panel;

function openSheet(title, text, bodyHtml, setup) {
  $("sheet").setAttribute("aria-label", title);
  $("sheet").innerHTML = `
    <button class="${ui.iconButton} absolute right-3 top-3" type="button" data-close aria-label="閉じる">${ui.icon("close", 5)}</button>
    <h2 class="${ui.dialog.title}">${esc(title)}</h2>
    <p class="${ui.dialog.text}">${text}</p>
    <div class="mt-5">${bodyHtml}</div>`;
  $("sheet").hidden = false;
  $("sheetBg").hidden = false;
  $("sheet").querySelector("[data-close]").onclick = closeSheet;
  setup?.($("sheet"));
}
function closeSheet() {
  $("sheet").hidden = true;
  $("sheetBg").hidden = true;
}
$("sheetBg").onclick = closeSheet;
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && !$("sheet").hidden) closeSheet();
});

function setupAccount(user) {
  const btn = $("acctBtn");
  btn.className = ui.button({ variant: "ghost", theme: "neutral", size: "sm" });
  btn.hidden = false;
  if (user.is_anonymous) {
    btn.innerHTML = `<span class="${ui.dot} mr-1.5"></span>メール未登録`;
    btn.onclick = () => openRegister();
  } else {
    btn.innerHTML = `${ui.buttonIcon("account_circle", "sm")}アカウント`;
    btn.onclick = () =>
      openSheet(
        "アカウント",
        `${esc(user.email)} でログインしている。他の端末では、このアドレスに届くコードでログインできる。`,
        `<button class="${ui.button({ variant: "outline", theme: "neutral" })} w-full" id="logout" type="button">${ui.buttonIcon("logout")}この端末からログアウト</button>`,
        (el) => {
          el.querySelector("#logout").onclick = async () => {
            await sb.auth.signOut();
            location.reload();
          };
        },
      );
  }
}

// 匿名の持ち主にメールアドレスを結び付ける。ユーザー ID は変わらないので、持ち主のまま他の端末からもログインできる
function openRegister() {
  openSheet("他の端末でも読む", "今はこの端末のブラウザでだけ読める。メールアドレスを登録すると、スマホや別の PC でもコードでログインできる。", `<div id="regForm"></div>`, (el) => {
    codeForm(el.querySelector("#regForm"), {
      sendLabel: "コードを送る",
      send: async (email) => {
        const { data, error } = await sb.auth.updateUser({ email }, { emailRedirectTo: PAGE_URL });
        if (error) throw error;
        // メール確認がオフの環境では、この時点で登録が終わっている
        if (data.user?.email === email && !data.user.is_anonymous) return "done";
      },
      verify: async (email, token) => {
        const { error } = await sb.auth.verifyOtp({ email, token, type: "email_change" });
        if (error) throw error;
      },
      done: async () => {
        el.querySelector("#regForm").innerHTML = `<p class="character-2-regular-pro text-text-middle">登録した。他の端末では、ページの「持ち主ならメールでログイン」から入れる。</p>`;
        const { data: { user } } = await sb.auth.getUser();
        if (user) setupAccount(user);
        document.querySelector("[data-callout]")?.remove();
      },
    });
  });
}

// ---------- 日記の表示 ----------

let entries = [];

// 「くわしく」の中の見出しのアイコンと色
const SECTION = {
  did: ["check_circle", "text-success-500"],
  failed: ["error", "text-negative-500"],
  learned: ["lightbulb", "text-warning-500"],
  open: ["pending", "text-info-500"],
  pr: ["merge", "text-primary-500"],
  files: ["description", "text-neutral-500"],
};

function render() {
  const q = $("q").value.trim().toLowerCase();
  const proj = $("proj").value;
  const shown = entries.filter((e) => {
    if (proj && e.cc_sessions?.project_name !== proj) return false;
    if (!q) return true;
    const hay = [e.title, e.body, ...e.did, ...e.failed, ...e.learned, ...e.open_threads, ...e.tags, e.cc_sessions?.project_name].join("\n").toLowerCase();
    return hay.includes(q);
  });
  const stream = $("stream");
  if (shown.length === 0) {
    stream.innerHTML = `<div class="flex flex-col items-center gap-2 py-16 text-center text-text-low">${ui.icon("search_off", 8)}<p class="character-2-regular-pro">${entries.length ? L().empty : L().none}</p></div>`;
    $("strip").innerHTML = "";
    $("index").innerHTML = "";
    return;
  }
  const days = new Map();
  for (const e of shown) {
    if (!days.has(e.diary_date)) days.set(e.diary_date, []);
    days.get(e.diary_date).push(e);
  }

  const focus = "outline-none focus-visible:ring-2 focus-visible:ring-border-ring focus-visible:ring-offset-2";
  let strip = "";
  let index = "";
  let lastMonth = "";
  for (const [d, list] of days) {
    strip += `<a class="flex-none grid justify-items-center min-w-14 px-2.5 py-1.5 rounded-action border border-divider-middle bg-white shadow-raise transition-colors hover:bg-neutral-50 active:border-primary-400 ${focus}" href="#d-${d}">
      <span class="character-3-bold-mono text-text-high">${Number(d.slice(5, 7))}.${d.slice(8)}</span>
      <span class="character-1-regular-pro text-text-low">${wday(d)} · ${list.length}</span></a>`;
    const month = d.slice(0, 7);
    if (month !== lastMonth) {
      index += `<div class="px-2 pt-4 pb-1 character-1-bold-pro text-text-low first:pt-0">${month.replace("-", ".")}</div>`;
      lastMonth = month;
    }
    index += `<a class="flex items-center justify-between h-9 px-2 rounded-notice character-2-regular-pro text-text-middle transition-colors hover:bg-[var(--color-black-alpha-50)] hover:text-text-high ${focus}" href="#d-${d}">
      <span>${L().index(Number(d.slice(8)), wday(d))}</span><span class="character-1-regular-mono text-text-low">${list.length}</span></a>`;
  }

  let html = "";
  let i = 0;
  for (const [d, list] of days) {
    const projects = [...new Set(list.map((e) => e.cc_sessions?.project_name).filter(Boolean))];
    html += `<section class="day scroll-mt-20 mb-12" id="d-${d}" style="animation-delay:${Math.min(i++, 6) * 50}ms">
      <div class="flex flex-wrap items-end gap-x-3 gap-y-1 mb-4">
        <span class="character-10-bold-mono text-text-high tabular-nums">${Number(d.slice(5, 7))}.${d.slice(8)}</span>
        <span class="pb-1.5 character-2-regular-pro text-text-low">${L().dayMeta(d.slice(0, 4), wday(d), list.length)}${projects.length ? ` · ${esc(projects.join(" / "))}` : ""}</span>
      </div>
      <div class="grid gap-4">`;
    for (const e of [...list].reverse()) {
      const startDay = e.span_started_at ? tokyoDay(e.span_started_at) : d;
      const span = e.span_started_at
        ? `${startDay !== d ? `${Number(startDay.slice(5, 7))}/${Number(startDay.slice(8))} ` : ""}${hm(e.span_started_at)}〜${hm(e.ended_at)}`
        : hm(e.ended_at);
      const sec = (key, label, items) => {
        const [name, color] = SECTION[key];
        return `<div><h3 class="flex items-center gap-1.5 character-2-bold-pro text-text-high">${ui.icon(name, 4, { cls: color })}${label}</h3>
          <ul class="mt-1 pl-6 list-disc marker:text-neutral-300 character-2-regular-pro text-text-middle leading-relaxed">${items}</ul></div>`;
      };
      const li = (xs) => xs.map((x) => `<li class="py-0.5">${inline(x)}</li>`).join("");
      const lists =
        (e.did.length ? sec("did", L().did, li(e.did)) : "") +
        (e.failed.length ? sec("failed", L().failed, li(e.failed)) : "") +
        (e.learned.length ? sec("learned", L().learned, li(e.learned)) : "") +
        (e.open_threads.length ? sec("open", L().open, li(e.open_threads)) : "") +
        (e.pr_urls.length ? sec("pr", "PR", e.pr_urls.map((u) => `<li class="py-0.5 break-all">${ui.externalLink(esc(u), esc(u.replace("https://github.com/", "")), 2)}</li>`).join("")) : "") +
        (e.files_touched.length ? sec("files", L().files, e.files_touched.map((f) => `<li class="py-0.5"><code>${esc(f)}</code></li>`).join("")) : "");
      html += `<article class="${ui.card.base} overflow-hidden">
        <header class="${ui.card.header}">
          <div class="flex flex-wrap items-center gap-x-2 gap-y-1 character-1-regular-pro text-text-low">
            <span class="character-1-bold-mono text-text-middle">${span}</span>
            ${e.cc_sessions?.project_name ? `<span class="${ui.tag.base} ${ui.tag.primary}">${esc(e.cc_sessions.project_name)}</span>` : ""}
            ${e.cc_sessions?.git_branch ? `<span class="inline-flex items-center gap-0.5 character-1-regular-mono">${ui.icon("call_split", 2)}${esc(e.cc_sessions.git_branch)}</span>` : ""}
          </div>
          <h2 class="${ui.card.title} mt-1">${esc(e.title)}</h2>
        </header>
        <div class="${ui.card.content} diary-body">${e.body.split(/\n{2,}/).map((p) => `<p>${inline(p).replace(/\n/g, "<br>")}</p>`).join("")}</div>
        <div class="flex flex-wrap items-center gap-1.5 px-6 pt-1 pb-4">
          ${e.tags.map((t) => `<button class="${ui.tagButton}" type="button" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}
          <span class="ml-auto character-1-regular-pro text-text-low">${L().meta(e.stats?.user_prompts ?? "?", e.stats?.tool_calls ?? "?")}</span>
        </div>
        ${lists ? `<details class="group border-t border-divider-low">
          <summary class="flex items-center gap-1 h-11 px-6 cursor-pointer character-2-bold-pro text-primary-500 transition-colors hover:bg-primary-50 ${focus} focus-visible:ring-inset focus-visible:ring-offset-0">${L().more}${ui.icon("expand_more", 5, { cls: "transition-transform group-open:rotate-180" })}</summary>
          <div class="diary-lists grid gap-4 px-6 pt-2 pb-5 bg-neutral-50 border-t border-divider-low">${lists}</div>
        </details>` : ""}
      </article>`;
    }
    html += `</div></section>`;
  }
  stream.innerHTML = html;
  $("strip").innerHTML = strip;
  $("index").innerHTML = index;
}

function start(list, countsHtml, calloutHtml = "") {
  entries = list;
  $("counts").innerHTML = countsHtml;
  root.innerHTML = `
    <nav class="strip flex gap-2 overflow-x-auto px-4 pt-3 pb-2 lg:hidden" id="strip" aria-label="日付"></nav>
    <div class="mx-auto max-w-[1120px] px-4 lg:px-8 pt-4 pb-24 lg:grid lg:grid-cols-[200px_minmax(0,720px)] lg:gap-12">
      <nav class="hidden lg:block sticky top-20 self-start max-h-[calc(100vh-6rem)] overflow-auto" id="index" aria-label="日付"></nav>
      <main>${calloutHtml}<div id="stream"></div></main>
    </div>`;
  const projects = [...new Set(entries.map((e) => e.cc_sessions?.project_name).filter(Boolean))].sort();
  $("proj").innerHTML = `<option value="">${L().all}</option>` + projects.map((p) => `<option>${esc(p)}</option>`).join("");
  $("q").placeholder = L().search;
  $("tools").hidden = false;
  render();
}

// 検索欄と絞り込み。Sparkle の Input と Select の見た目
$("qWrap").insertAdjacentHTML("beforeend", `<div class="${ui.input.wrap} ${ui.input.md}">${ui.icon("search", 5, { cls: "pl-1.5 text-neutral-500" })}<input class="${ui.input.field}" id="q" type="search" placeholder="検索" autocomplete="off" enterkeyhint="search"></div>`);
$("projWrap").innerHTML = `<div class="${ui.select.wrap}"><select class="${ui.select.field}" id="proj" aria-label="プロジェクト"><option value="">すべて</option></select>${ui.icon("expand_more", 5, { cls: ui.select.icon })}</div>`;

root.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-tag]");
  if (t) {
    $("q").value = t.dataset.tag;
    render();
    window.scrollTo({ top: 0 });
    return;
  }
  if (ev.target.closest("[data-register]")) openRegister();
});
$("q").addEventListener("input", () => render());
$("proj").addEventListener("change", () => render());

// ---------- デモの説明 ----------

const ABOUT = {

// ---------- 画面の切り替え ----------

function showLocked(stats) {
  $("counts").textContent = visitorsText(stats);
  notice("閉じています", "この日記は、持ち主だけが読める。", `
    <div class="mt-6 flex flex-col gap-2 sm:flex-row sm:justify-center">
      <a class="${ui.button()}" href="?demo&lang=ja">${ui.buttonIcon("visibility")}デモを見る</a>
      <a class="${ui.button({ variant: "outline", theme: "neutral" })}" href="?demo&lang=en" lang="en">See the demo in English</a>
    </div>
    <details class="group mt-10 border-t border-divider-middle pt-4">
      <summary class="${ui.button({ variant: "ghost", theme: "neutral", size: "sm" })} mx-auto w-fit">${ui.buttonIcon("key", "sm")}持ち主ならメールでログイン${ui.icon("expand_more", 3, { cls: "ml-1 transition-transform group-open:rotate-180" })}</summary>
      <div class="${ui.card.base} mt-4 p-6" id="loginForm"></div>
    </details>`, { icon: "lock" });
  codeForm($("loginForm"), {
    sendLabel: "コードを送る",
    // 登録済みのアドレスにだけ送る。知らないアドレスでユーザーを作らない
    send: async (email) => {
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: PAGE_URL } });
      if (error) throw error;
    },
    verify: async (email, token) => {
      const { error } = await sb.auth.verifyOtp({ email, token, type: "email" });
      if (error) throw error;
    },
    done: async () => location.replace(PAGE_URL),
  });
}

async function main() {
  const demo = new URLSearchParams(location.search).has("demo");
  let user = null;
  try {
    user = await currentUser();
  } catch (e) {
    if (!demo) {
      notice("つながらない", `Supabase に接続できなかった。${e.message ?? e}`, "", { icon: "cloud_off", bad: true });
      return;
    }
  }
  if (demo) {
    LANG = demoLang();
    document.documentElement.lang = LANG;
    const stats = user ? await recordVisit("demo") : null;
    const sw = L().switchTo;
    const link = $("langLink");
    link.className = ui.button({ variant: "ghost", theme: "neutral", size: "sm" });
    link.href = `?demo&lang=${sw.lang}`;
    link.lang = sw.lang;
    link.innerHTML = `${ui.buttonIcon("translate", "sm")}${sw.label}`;
    link.hidden = false;
    start(
      LANG === "en" ? DEMO_ENTRIES_EN : DEMO_ENTRIES,
      `<span class="${ui.tag.base} ${ui.tag.warning} mr-1">${L().demo}</span>${L().basis}${stats ? ` · ${L().visitors(stats.visitors)}` : ""}`,
      ABOUT[LANG],
    );
    return;
  }
  let owner;
  try {
    owner = await claimOwner();
  } catch (e) {
    notice("つながらない", `Supabase に接続できなかった。${e.message ?? e}`, "", { icon: "cloud_off", bad: true });
    return;
  }
  if (!owner) {
    showLocked(await recordVisit("locked"));
    return;
  }
  const visitStats = await recordVisit("owner");
  setupAccount(user);
  const [{ data, error }, { data: queue }] = await Promise.all([
    sb.from("diary_entries")
      .select("id, diary_date, ended_at, span_started_at, title, body, did, failed, learned, open_threads, tags, pr_urls, files_touched, stats, cc_sessions(project_name, git_branch)")
      .eq("status", "written")
      .order("ended_at", { ascending: false })
      .limit(2000),
    sb.from("diary_entries").select("status").neq("status", "written"),
  ]);
  if (error) {
    notice("読めなかった", error.message, "", { icon: "error", bad: true });
    return;
  }
  const pending = (queue ?? []).filter((r) => r.status === "pending" || r.status === "generating").length;
  const failed = (queue ?? []).filter((r) => r.status === "failed").length;
  const counts = [`${data.length}件`, pending ? `生成待ち ${pending}` : "", failed ? `<span class="text-negative-500">失敗 ${failed}</span>` : "", visitorsText(visitStats)].filter(Boolean).join(" · ");
  const callout = user.is_anonymous
    ? `<div class="${ui.inlineMessage.info} mb-6" data-callout role="status">
        <span class="${ui.inlineMessage.icon}">${ui.icon("info", 6)}</span>
        <p class="${ui.inlineMessage.body}">今はこの端末でだけ読める。<button class="${ui.link} cursor-pointer" type="button" data-register>メールを登録</button>すると、他の端末でも読める。</p>
      </div>`
    : "";
  start(data, counts, callout);
}

main();
</script>
